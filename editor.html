<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor | Mochila Inteligente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cosmic: 'var(--text-on-primary)',
            sangria: 'var(--brand-primary)',
            cornflower: 'var(--brand-accent)',
            charcoal: 'var(--text-on-accent)',
            carddark: 'var(--bg-card)',
            alerta: 'var(--brand-alert)'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">

  <a href="#conteudo-principal" class="skip-link no-print">Pular para o conteudo principal</a>

  <header class="custom-header py-4 px-6 flex flex-wrap items-center justify-between gap-4 no-print">
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="px-4 py-2 rounded-lg border-2 border-cornflower font-black text-xs uppercase tracking-wider hover:bg-cornflower hover:text-charcoal transition">Voltar ao Armario</a>
      <div>
        <h1 id="editor-caderno-titulo" class="text-lg font-black text-sangria leading-tight">Caderno</h1>
        <p id="editor-caderno-subtitulo" class="text-xs font-bold opacity-80">Materia | Semestre</p>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <span id="save-status" aria-live="polite" class="text-xs font-black px-3 py-1.5 rounded-lg bg-cornflower text-charcoal">Salvo</span>
      <button type="button" onclick="exportNotebookPdf()" class="px-4 py-2 rounded-lg bg-alerta text-cosmic font-black text-xs uppercase tracking-wider hover:opacity-90 transition">Exportar PDF</button>
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg border-2 border-cornflower" role="group" aria-label="Controles de acessibilidade">
        <button type="button" onclick="changeFontSize(-1)" class="px-2 py-1 bg-cornflower text-charcoal rounded font-bold text-xs hover:bg-sangria hover:text-cosmic transition" aria-label="Diminuir fonte">Menor</button>
        <button type="button" onclick="changeFontSize(0)" class="px-2 py-1 bg-cornflower text-charcoal rounded font-bold text-xs hover:bg-sangria hover:text-cosmic transition" aria-label="Restaurar fonte padrao">Padrao</button>
        <button type="button" onclick="changeFontSize(1)" class="px-2 py-1 bg-cornflower text-charcoal rounded font-bold text-xs hover:bg-sangria hover:text-cosmic transition" aria-label="Aumentar fonte">Maior</button>
        <button type="button" onclick="toggleTheme()" class="theme-switch" aria-label="Alternar tema">
          <span class="theme-switch-knob">
            <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <circle cx="12" cy="12" r="5"></circle>
              <polygon points="12,1 10.5,5 13.5,5"></polygon>
              <polygon points="12,23 10.5,19 13.5,19"></polygon>
              <polygon points="1,12 5,10.5 5,13.5"></polygon>
              <polygon points="23,12 19,10.5 19,13.5"></polygon>
              <polygon points="4.2,4.2 7.8,6.2 6.2,7.8"></polygon>
              <polygon points="19.8,19.8 16.2,17.8 17.8,16.2"></polygon>
              <polygon points="19.8,4.2 16.2,6.2 17.8,7.8"></polygon>
              <polygon points="4.2,19.8 7.8,17.8 6.2,16.2"></polygon>
            </svg>
            <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M13.5 4.5a7.5 7.5 0 1 0 6 12 6.5 6.5 0 0 1-6-12z"></path>
              <path d="M17.5 7l.7 1.5 1.5.7-1.5.7-.7 1.5-.7-1.5-1.5-.7 1.5-.7z"></path>
              <path d="M20.5 11.5l.5 1 1 .5-1 .5-.5 1-.5-1-1-.5 1-.5z"></path>
            </svg>
          </span>
        </button>
      </div>
    </div>
  </header>

  <section id="editor-toolbar" aria-label="Ferramentas de edicao" class="custom-card mx-auto mt-6 px-5 py-3 w-[95%] max-w-5xl flex flex-wrap items-center justify-between gap-3 no-print">
    <div class="flex flex-wrap items-center gap-2">
      <select id="editor-pauta-select" aria-label="Estilo de folha" onchange="changeSheetStyle(this.value)" class="px-3 py-2 rounded-lg border-2 border-cornflower bg-transparent text-xs font-black outline-none">
        <option value="Com pauta" class="bg-carddark text-charcoal">Com pauta</option>
        <option value="Sem pauta" class="bg-carddark text-charcoal">Sem pauta</option>
        <option value="Quadriculado" class="bg-carddark text-charcoal">Quadriculado</option>
        <option value="Pontilhado" class="bg-carddark text-charcoal">Pontilhado</option>
      </select>

      <select id="editor-size-select" aria-label="Tamanho do texto da folha" onchange="changeEditorTextSize(this.value)" class="px-3 py-2 rounded-lg border-2 border-cornflower bg-transparent text-xs font-black outline-none">
        <option value="16" class="bg-carddark text-charcoal">Texto 16</option>
        <option value="18" class="bg-carddark text-charcoal">Texto 18</option>
        <option value="20" class="bg-carddark text-charcoal">Texto 20</option>
      </select>

      <label class="color-picker-wrap" for="editor-color-picker">
        <span>Cor</span>
        <input type="color" id="editor-color-picker" value="#1155CC" oninput="changeTextColor(this.value)" onchange="changeTextColor(this.value)" aria-label="Escolher cor do texto" class="color-picker-input">
      </label>

      <button type="button" onclick="formatBold()" class="px-3 py-2 rounded-lg border-2 border-cornflower font-black text-xs hover:bg-cornflower hover:text-charcoal transition">Negrito</button>
      <button type="button" onclick="insertSectionTitle()" class="px-3 py-2 rounded-lg border-2 border-cornflower font-black text-xs hover:bg-cornflower hover:text-charcoal transition">Titulo de Secao</button>
      <button type="button" onclick="insertChecklist()" class="px-3 py-2 rounded-lg border-2 border-cornflower font-black text-xs hover:bg-cornflower hover:text-charcoal transition">Checklist</button>
      <button type="button" onclick="addStickyNote()" class="px-3 py-2 rounded-lg bg-cornflower text-charcoal font-black text-xs hover:opacity-90 transition">Post it</button>
      <button type="button" onclick="triggerImageUpload()" class="px-3 py-2 rounded-lg border-2 border-cornflower font-black text-xs hover:bg-cornflower hover:text-charcoal transition">Imagem</button>
      <input type="file" id="editor-image-input" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
      <button type="button" id="btn-bookmark" onclick="toggleBookmark()" aria-pressed="false" class="px-3 py-2 rounded-lg border-2 border-alerta text-alerta font-black text-xs hover:bg-alerta hover:text-cosmic transition">Marca Pagina</button>
    </div>

    <div class="flex items-center gap-2">
      <button type="button" onclick="addNewPage()" class="px-3 py-2 rounded-lg bg-sangria text-cosmic font-black text-xs uppercase tracking-wider hover:opacity-90 transition">Nova Pagina</button>
      <button type="button" id="btn-delete-page" onclick="deleteCurrentPage()" class="px-3 py-2 rounded-lg border-2 border-alerta text-alerta font-black text-xs uppercase tracking-wider hover:bg-alerta hover:text-cosmic transition">Excluir Pagina</button>
    </div>
  </section>

  <main id="conteudo-principal" class="flex-grow container mx-auto px-4 py-8 max-w-5xl">
    <div id="editor-missing" class="hidden alert-banner p-10 text-center max-w-lg mx-auto">
      <span class="inline-block bg-alerta text-cosmic text-xs font-black px-2.5 py-1 rounded mb-3 uppercase tracking-wider">Aviso</span>
      <h2 class="text-2xl font-black mb-3">Caderno nao encontrado</h2>
      <p class="text-sm opacity-80 mb-6">Selecione um caderno valido no seu armario para iniciar as anotacoes.</p>
      <a href="dashboard.html" class="inline-block bg-sangria text-cosmic font-black px-6 py-3 rounded-lg text-xs uppercase tracking-wider">Ir para o Armario</a>
    </div>

    <div id="editor-workspace" class="flex flex-col md:flex-row items-start justify-center gap-4">
      <div id="notebook-sheet" class="notebook-sheet flex-grow w-full rounded-xl border-2 border-cornflower overflow-hidden">
        <div id="bookmark-ribbon" class="bookmark-ribbon hidden" aria-hidden="true"></div>
        <div class="px-6 py-3 border-b-2 border-cornflower flex justify-between items-center text-xs font-black uppercase tracking-wider">
          <span id="sheet-header-label">Materia / Caderno</span>
          <span id="sheet-page-label" class="mr-10">Pagina 1</span>
        </div>

        <div id="page-body" class="page-body relative pl-10 pr-6 py-6">
          <div id="floating-layer" class="floating-layer"></div>
          <div id="editor-content" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Area de anotacoes do caderno" oninput="handleEditorInput()" onmouseup="saveEditorSelection()" onkeyup="saveEditorSelection()" class="editor-content" data-placeholder="Comece a escrever suas anotacoes sobre a pauta..."></div>
        </div>
      </div>

      <aside id="pages-tabs" aria-label="Paginas do caderno" class="flex md:flex-col gap-2 no-print">
      </aside>
    </div>
  </main>

  <footer class="custom-footer py-6 px-8 text-center text-xs font-black uppercase tracking-wider mt-12 no-print">
    <p>Mochila Inteligente</p>
    <p class="mt-1">Desenvolvimento de Interfaces</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
