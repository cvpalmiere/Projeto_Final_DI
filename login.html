<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Mochila Inteligente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'on-primary': 'var(--text-on-primary)',
            primary: 'var(--brand-primary)',
            accent: 'var(--brand-accent)',
            'on-accent': 'var(--text-on-accent)',
            surface: 'var(--bg-card)',
            danger: 'var(--brand-danger)'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">

  <a href="#conteudo-principal" class="skip-link">Pular para o conteúdo principal</a>

  <header class="custom-header py-5 px-8 flex flex-wrap items-center justify-between gap-4">
    <a href="index.html" class="flex items-center gap-3">
      <div class="w-4 h-8 bg-danger rounded-sm"></div>
      <h1 class="text-2xl font-black text-primary tracking-tight">Mochila Inteligente</h1>
    </a>
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg border-2 border-accent" role="group" aria-label="Controles de acessibilidade">
        <button type="button" onclick="changeFontSize(-1)" class="px-2 py-1 bg-accent text-on-accent rounded font-bold text-xs hover:bg-primary hover:text-on-primary transition" aria-label="Diminuir fonte">Menor</button>
        <button type="button" onclick="changeFontSize(0)" class="px-2 py-1 bg-accent text-on-accent rounded font-bold text-xs hover:bg-primary hover:text-on-primary transition" aria-label="Restaurar fonte padrão">Padrão</button>
        <button type="button" onclick="changeFontSize(1)" class="px-2 py-1 bg-accent text-on-accent rounded font-bold text-xs hover:bg-primary hover:text-on-primary transition" aria-label="Aumentar fonte">Maior</button>
        <button type="button" onclick="toggleTheme()" class="theme-switch" aria-label="Alternar tema">
          <span class="theme-switch-knob">
            <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <circle cx="12" cy="12" r="5"></circle>
              <polygon points="12,1 10.5,5 13.5,5"></polygon>
              <polygon points="12,23 10.5,19 13.5,19"></polygon>
              <polygon points="1,12 5,10.5 5,13.5"></polygon>
              <polygon points="23,12 19,10.5 19,13.5"></polygon>
              <polygon points="4.2,4.2 7.8,6.2 6.2,7.8"></polygon>
              <polygon points="19.8,19.8 16.2,17.8 17.8,16.2"></polygon>
              <polygon points="19.8,4.2 16.2,6.2 17.8,7.8"></polygon>
              <polygon points="4.2,19.8 7.8,17.8 6.2,16.2"></polygon>
            </svg>
            <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M13.5 4.5a7.5 7.5 0 1 0 6 12 6.5 6.5 0 0 1-6-12z"></path>
              <path d="M17.5 7l.7 1.5 1.5.7-1.5.7-.7 1.5-.7-1.5-1.5-.7 1.5-.7z"></path>
              <path d="M20.5 11.5l.5 1 1 .5-1 .5-.5 1-.5-1-1-.5 1-.5z"></path>
            </svg>
          </span>
        </button>
      </div>
      <a href="index.html" class="px-4 py-2 rounded-lg border-2 border-accent font-black text-xs uppercase tracking-wider hover:bg-accent hover:text-on-accent transition">Início</a>
    </div>
  </header>

  <main id="conteudo-principal" class="flex-grow flex items-center justify-center px-6 py-12">
    <div class="custom-card p-8 md:p-10 w-full max-w-md">
      <span class="inline-block bg-danger text-on-primary text-xs font-black px-3 py-1 rounded mb-4 uppercase tracking-wider">Acesso ao Armário</span>
      <h2 class="text-3xl font-black text-primary mb-2">Entrar na conta</h2>
      <p class="text-sm opacity-80 mb-8">Informe suas credenciais para abrir seus semestres e cadernos digitais.</p>

      <form onsubmit="handleLogin(event)" class="space-y-5">
        <div>
          <label for="login-email" class="block text-xs font-black uppercase tracking-wider mb-2">Email Acadêmico</label>
          <input type="email" id="login-email" required autocomplete="email" placeholder="estudante@instituicao.edu.br" class="w-full px-4 py-3 rounded-lg border-2 border-accent bg-transparent text-sm font-bold">
        </div>
        <div>
          <label for="login-senha" class="block text-xs font-black uppercase tracking-wider mb-2">Senha</label>
          <input type="password" id="login-senha" required autocomplete="current-password" placeholder="Digite sua senha" class="w-full px-4 py-3 rounded-lg border-2 border-accent bg-transparent text-sm font-bold">
        </div>
        <button type="submit" class="w-full bg-primary text-on-primary font-black py-3.5 px-4 rounded-lg hover:opacity-90 transition uppercase tracking-wider text-sm">Acessar Painel</button>
      </form>

      <div class="mt-6 pt-6 border-t-2 border-accent text-center">
        <a href="dashboard.html" class="text-xs font-black uppercase tracking-wider text-danger hover:underline">Entrar como visitante no painel</a>
      </div>
    </div>
  </main>

  <footer class="custom-footer py-6 px-8 text-center text-xs font-black uppercase tracking-wider mt-12">
    <p>Mochila Inteligente</p>
    <p class="mt-1">Desenvolvimento de Interfaces</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
